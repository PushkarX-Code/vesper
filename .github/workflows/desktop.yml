name: Windows app

# Builds Vesper for Windows on GitHub's free Windows machines.
# Every pull request that touches the app gets a test build; a tag like desktop-v0.1.0 publishes a release.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "index.html"
      - "sw.js"
      - "version.json"
      - "manifest*.webmanifest"
      - "fonts/**"
      - "vendor/**"
      - "icons/**"
      - "chars/**"
      - "studio/**"
      - "learn/**"
      - ".github/workflows/desktop.yml"
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # The llama.cpp release whose Windows Vulkan build runs the models (Nvidia, AMD and Intel graphics, or the processor).
  LLAMA_CPP_TAG: b12600

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Get the model engine (llama.cpp)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:LLAMA_CPP_TAG --repo ggml-org/llama.cpp --pattern "llama-*-bin-win-vulkan-x64.zip" --dir engine-zip
          $zip = Get-ChildItem engine-zip -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "No Windows Vulkan build found in llama.cpp $env:LLAMA_CPP_TAG" }
          Expand-Archive -Path $zip.FullName -DestinationPath engine-raw -Force
          $server = Get-ChildItem engine-raw -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe is missing from $($zip.Name)" }
          Copy-Item (Join-Path $server.DirectoryName "llama-server.exe") desktop/src-tauri/engine/
          Copy-Item (Join-Path $server.DirectoryName "*.dll") desktop/src-tauri/engine/
          Get-ChildItem desktop/src-tauri/engine | Format-Table Name, Length

      - name: Install build tools
        working-directory: desktop
        run: npm ci

      - name: Build the installer
        working-directory: desktop
        run: npm run build

      - name: Build the Microsoft Store package
        shell: pwsh
        run: ./desktop/scripts/make-msix.ps1

      - name: Keep the Store package
        uses: actions/upload-artifact@v4
        with:
          name: vesper-msix
          path: desktop/*.msix
          if-no-files-found: error

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: vesper-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Vesper for Windows ${{ github.ref_name }}
          body: |
            Vesper for Windows. Download the setup file (.exe) below and run it.

            Windows may show "Windows protected your PC" because the app isn't signed yet. Click More info, then Run anyway.

            Models on this PC: open Settings, Local models, Models on this PC. Vesper checks your memory and graphics card, suggests models that fit, downloads them and runs them offline.
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
