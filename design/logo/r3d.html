<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./three/three.module.js","three/addons/":"./three/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from "three";
import {RoomEnvironment} from "three/addons/environments/RoomEnvironment.js";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";
import {OutputPass} from "three/addons/postprocessing/OutputPass.js";
import {blades, petals} from "./blades.js";
const q = new URLSearchParams(location.search);
const shape = q.get("shape")||"petals", mat = q.get("mat")||"glass", view = q.get("view")||"hero", W = +(q.get("w")||900), bg = q.get("bg")||"blue";
const transparent = q.get("transparent") === "1";
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true, alpha:transparent}); if (transparent) renderer.setClearColor(0x000000, 0);
renderer.setSize(W,W); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
// studio: black room, softbox strips, a blue rim panel
const env = new THREE.Scene(); env.background = new THREE.Color(0x020203);
const box = (w,h,col,pos,look) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({color:col, side:THREE.DoubleSide})); m.position.set(...pos); m.lookAt(...look); env.add(m); };
box(7,1.6,new THREE.Color(9,9,9.5),[0,5,1],[0,0,0]);
box(0.7,7,new THREE.Color(7,7,7.5),[-5,0.5,2],[0,0,0]);
box(0.9,7,new THREE.Color(1.2,1.8,7),[5,0,1],[0,0,0]);
box(8,2,new THREE.Color(0.6,0.8,4),[0,-5,0],[0,0,0]);
box(2.5,2.5,new THREE.Color(3,3,3.4),[1.5,2,6],[0,0,0]);
{ // big gradient softbox in front and above: gives the faces a sheen
  const c2 = document.createElement("canvas"); c2.width = 4; c2.height = 256; const x = c2.getContext("2d");
  const lg = x.createLinearGradient(0,0,0,256); lg.addColorStop(0,"#ffffff"); lg.addColorStop(0.5,"#6b7aa8"); lg.addColorStop(1,"#000000"); x.fillStyle = lg; x.fillRect(0,0,4,256);
  const t2 = new THREE.CanvasTexture(c2); const fb = +(q.get("front")||3.2);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(14,9), new THREE.MeshBasicMaterial({map:t2, color:new THREE.Color(fb,fb,fb*1.08), side:THREE.DoubleSide}));
  m.position.set(0,3.5,7); m.lookAt(0,0,0); env.add(m);
}
scene.environment = pm.fromScene(env, 0.02).texture;
// backdrop: deep gradient with a glow
const cv = document.createElement("canvas"); cv.width = cv.height = 1024; const g = cv.getContext("2d");
const BG = {blue:["#05060d","#0c1240","#3a3cff"], violet:["#06050c","#1d0f45","#7a4dff"], black:["#000","#050507","#14161f"]}[bg];
g.fillStyle = BG[0]; g.fillRect(0,0,1024,1024);
let rg = g.createRadialGradient(512,1100,40,512,1100,900); rg.addColorStop(0,BG[2]); rg.addColorStop(0.45,BG[1]); rg.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle = rg; g.fillRect(0,0,1024,1024);
rg = g.createRadialGradient(512,470,10,512,470,560); rg.addColorStop(0,"rgba(110,130,255,"+(q.get("halo")||"0.28")+")"); rg.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle = rg; g.fillRect(0,0,1024,1024);
const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
const plane = new THREE.Mesh(new THREE.PlaneGeometry(14,14), new THREE.MeshBasicMaterial({map:tex, toneMapped:false})); plane.position.z = -3; if (!transparent) scene.add(plane);
// geometry
const polys = shape === "petals" ? petals({rIn:+(q.get("rin")||26)}) : blades(JSON.parse(q.get("p") || '{"rLow":90,"bend":0.8,"gap":16}'));
const group = new THREE.Group();
const materials = {
  glass: new THREE.MeshPhysicalMaterial({color:0xdfe6ff, metalness:0, roughness:0.04, transmission:1, thickness:1.2, ior:1.55, attenuationColor:new THREE.Color(0x5b7bff), attenuationDistance:1.6, clearcoat:1, clearcoatRoughness:0.05, specularIntensity:1, envMapIntensity:1.4, dispersion:3}),
  chrome: new THREE.MeshPhysicalMaterial({color:0xf2f4ff, metalness:1, roughness:0.07, clearcoat:1, clearcoatRoughness:0.05, envMapIntensity:1.6}),
  satin: new THREE.MeshPhysicalMaterial({color:0xf3f4fa, metalness:0, roughness:0.32, clearcoat:0.8, clearcoatRoughness:0.2, sheen:0.4, envMapIntensity:1.1}),
  pearl: new THREE.MeshPhysicalMaterial({color:0xeef1ff, metalness:0.15, roughness:0.22, clearcoat:1, clearcoatRoughness:0.06, iridescence:0.35, iridescenceIOR:1.3, envMapIntensity:1.3}),
  ink: new THREE.MeshPhysicalMaterial({color:0x2c46ff, metalness:0.2, roughness:0.18, clearcoat:1, clearcoatRoughness:0.08, envMapIntensity:1.2, iridescence:0.4})
};
for (const p of polys) {
  const s = new THREE.Shape(); p.forEach(([x,y],i) => { const X = (x-256)/110, Y = -(y-256)/110; i ? s.lineTo(X,Y) : s.moveTo(X,Y); });
  const geo = new THREE.ExtrudeGeometry(s, {depth:0.32, bevelEnabled:true, bevelThickness:0.14, bevelSize:0.075, bevelSegments:10, curveSegments:24});
  geo.translate(0,0,-0.16); geo.computeVertexNormals();
  group.add(new THREE.Mesh(geo, materials[mat]));
}
if (q.get("core")) { // the evening star: a small glowing four point star in the empty center
  const sh = new THREE.Shape(); const n=4, ro=+(q.get("core")), ri=ro*0.16;
  for (let i=0;i<=192;i++){ const t=i/192*Math.PI*2; const c=Math.cos(t), s=Math.sin(t); const X=ro*Math.sign(c)*Math.pow(Math.abs(c),2.6), Y=ro*1.08*Math.sign(s)*Math.pow(Math.abs(s),2.6); i? sh.lineTo(X,Y) : sh.moveTo(X,Y); }
  const sg = new THREE.ExtrudeGeometry(sh,{depth:0.04,bevelEnabled:true,bevelThickness:0.03,bevelSize:0.02,bevelSegments:4}); sg.translate(0,0,0.05);
  group.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({color:new THREE.Color(2.2,2.5,3.6), toneMapped:false})));
}
{ const bb = new THREE.Box3().setFromObject(group), c = bb.getCenter(new THREE.Vector3()); group.children.forEach(m => m.position.sub(new THREE.Vector3(c.x, c.y, 0))); }
const pivot = new THREE.Group(); pivot.add(group); group.rotation.set(0,0,0);
scene.add(pivot);
const key = new THREE.DirectionalLight(0xffffff, 0.6); key.position.set(-3,4,5); scene.add(key);
const rim = new THREE.DirectionalLight(0x6f86ff, 2.0); rim.position.set(3,-2,-2); scene.add(rim);
const fill = new THREE.PointLight(0x8aa0ff, 8, 12); fill.position.set(0,-2.5,2.5); scene.add(fill);
const cam = new THREE.PerspectiveCamera(view === "hero" ? 30 : 22, 1, 0.1, 100);
if (view === "hero") { cam.position.set(0,0,9.6); pivot.rotation.set(-0.3, 0.32, 0.06); }
else if (view === "icon") { cam.position.set(0,0,+(q.get("cz")||13.2)); pivot.rotation.set(-0.2, 0.22, 0.03); }
else { cam.position.set(0,0,11.5); pivot.rotation.set(-0.12, 0.1, 0); }
const comp = new EffectComposer(renderer); comp.addPass(new RenderPass(scene, cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,W), +(q.get("bloom")||0.28), 0.5, 0.92)); comp.addPass(new OutputPass());
if (transparent) { renderer.render(scene, cam); } else { comp.render(); comp.render(); }
window.DONE = true;
</script></body></html>
