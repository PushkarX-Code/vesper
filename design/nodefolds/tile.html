<!doctype html><html><head><style>
body{margin:0;background:#000;display:grid;place-items:center;width:1200px;height:700px;gap:0;grid-template-columns:1fr 1fr}
.t{position:relative;width:420px;height:420px;border-radius:104px;background:radial-gradient(120% 90% at 30% 10%,#ffb072 0%,transparent 45%),linear-gradient(160deg,#ff8a3d,#ff4d0a 48%,#c42a00);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -30px 60px rgba(90,10,0,.35),0 50px 140px rgba(255,90,20,.5);display:grid;place-items:center;overflow:hidden}
.t::before{content:"";position:absolute;left:6%;right:6%;top:3%;height:42%;border-radius:90px 90px 50% 50%;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0))}
.t img{position:relative;width:62%;filter:drop-shadow(0 10px 18px rgba(110,20,0,.45))}
.d{width:420px;height:420px;border-radius:104px;background:#0d0d10;box-shadow:0 0 0 1px rgba(255,255,255,.1);display:grid;place-items:center}.d img{width:62%}
</style></head><body><div class="t"><img src="mark.svg"></div><div class="d"><img src="mark.svg"></div></body></html>
