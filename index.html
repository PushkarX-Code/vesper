<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Vesper</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" id="lnkManifest" href="manifest.webmanifest">
<link rel="icon" id="lnkIcon" href="icons/chrome/icon-192.png" type="image/png">
<link rel="apple-touch-icon" id="lnkTouch" href="icons/chrome/icon-192.png">
<link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" as="image" href="icons/chrome/mark.webp" type="image/webp">
<style>
/* Vesper. One column chat: header, thread, composer. Pure black, Inter, one blue accent from the logo.
   Every panel (drawer, sheet, page, dialog) is a "layer": it cannot be tapped while it animates or once it closes. */
@font-face{font-family:"Inter";src:url("fonts/inter-var.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{
  --bg:#000000;
  --surface:#0f0f11;
  --raised:#18181b;
  --raised-2:#222226;
  --sheet:#111113;
  --line:#26262a;
  --line-soft:#1a1a1d;
  --fg:#f5f5f4;
  --fg-soft:#cfcfcc;
  --muted:#939391;
  --faint:#646462;
  --accent:#6ea8ff;
  --danger:#ff7a6b;
  --ok:#7fd8a0;
  --ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.32,.72,0,1);
  --d:300ms;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
svg{display:block}
.ic{width:20px;height:20px;flex:0 0 auto}

.app{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top,0px)}

/* header */
.top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:56px;flex:0 0 auto;
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.top-center{display:flex;justify-content:center;min-width:0}
.top-title{font-size:15px;font-weight:600;color:var(--fg-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.priv{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;background:var(--raised);font-size:13.5px;font-weight:500;color:var(--fg-soft)}
.priv .ic{width:16px;height:16px;color:var(--accent)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg-soft);transition:background .15s,color .15s}
.icon-btn:active{background:var(--raised);color:var(--fg)}
.icon-btn.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}

/* thread */
.thread{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.thread-inner{max-width:760px;margin:0 auto;padding:10px 0 26px;display:flex;flex-direction:column;gap:22px;min-height:100%}

.msg{display:flex;flex-direction:column;gap:4px;animation:rise .28s var(--ease) both}
.msg.user{align-items:flex-end}
.bubble{max-width:86%;background:var(--raised);padding:10px 16px;border-radius:22px 22px 8px 22px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;cursor:pointer}
.answer{min-width:0;font-size:16.5px;line-height:1.65;overflow-wrap:anywhere}
.answer p{margin:0 0 .85em}
.answer .md > :last-child{margin-bottom:0}
.answer strong{font-weight:600}
.answer em{color:var(--fg-soft)}
.answer ul,.answer ol{margin:0 0 .85em;padding-left:1.35em}
.answer li{margin:.3em 0}
.answer h1,.answer h2,.answer h3,.answer h4{font-weight:600;line-height:1.3;letter-spacing:-.01em;margin:1.2em 0 .5em;text-wrap:balance}
.answer h1{font-size:1.3em}.answer h2{font-size:1.17em}.answer h3,.answer h4{font-size:1.04em}
.answer blockquote{margin:0 0 .85em;padding-left:14px;border-left:2px solid var(--line);color:var(--fg-soft)}
.answer code{font-family:var(--mono);font-size:.86em;background:var(--raised);padding:.14em .42em;border-radius:6px}
.answer pre{margin:0;padding:12px 14px;overflow-x:auto;line-height:1.55}
.answer pre code{background:none;padding:0;font-size:13.5px}
.answer a{color:var(--accent);text-underline-offset:2px}
.answer hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.answer table{border-collapse:collapse;display:block;overflow-x:auto;margin-bottom:.85em;font-size:15px}
.answer th,.answer td{border:1px solid var(--line);padding:7px 11px;text-align:left}
.answer th{font-weight:600;background:var(--surface)}
.code{margin:0 0 .9em;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 14px;border-bottom:1px solid var(--line-soft);font-size:12.5px;color:var(--muted)}
.code-copy{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--muted)}
.code-copy .ic{width:14px;height:14px}
.code-copy:active{background:var(--raised);color:var(--fg)}

.acts{display:flex;align-items:center;gap:2px;margin-left:-8px;min-height:34px}
.msg.user .acts{margin:0 -6px 0 0;height:0;min-height:0;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .2s}
.msg.user.open .acts{height:36px;opacity:1;pointer-events:auto}
.act{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.act .ic{width:17px;height:17px}
.act:active{background:var(--raised);color:var(--fg)}
.by{font-size:12.5px;color:var(--faint);margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.thinking{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:15px}
.shimmer{background:linear-gradient(90deg,var(--faint) 0%,var(--fg-soft) 50%,var(--faint) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.6s linear infinite}

.reason{margin:0 0 12px}
.reason summary{list-style:none;cursor:pointer;color:var(--muted);font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.reason summary::-webkit-details-marker{display:none}
.reason summary .ic{width:15px;height:15px;transition:transform .2s}
.reason[open] summary .ic{transform:rotate(180deg)}
.reason .rtext{margin-top:6px;padding-left:12px;border-left:2px solid var(--line);color:var(--muted);font-size:14px;line-height:1.6;white-space:pre-wrap;max-height:280px;overflow:auto}

.errcard{border:1px solid color-mix(in srgb,var(--danger) 30%,var(--line));background:color-mix(in srgb,var(--danger) 6%,var(--surface));border-radius:18px;padding:14px 14px 12px 16px;display:flex;flex-direction:column;gap:12px}
.errcard p{margin:0;color:var(--fg-soft);font-size:15px;line-height:1.5}
.errcard .pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:36px;padding:0 14px 0 12px;border-radius:999px;background:var(--raised);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.pill .ic{width:16px;height:16px;color:var(--muted)}
.pill:active{background:var(--raised-2)}

/* empty state */
.hero{flex:1;display:flex;flex-direction:column;min-height:100%}
.hero-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:28px 0 20px}
.hero .mark{height:84px;width:auto;filter:drop-shadow(0 14px 40px var(--glow,rgba(110,140,255,.38)));animation:drift 7s ease-in-out infinite}
.hero h1{font-size:clamp(28px,8vw,36px);font-weight:600;letter-spacing:-.025em;line-height:1.12;margin:10px 0 0;text-wrap:balance}
.hero h1 i{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--muted);font-size:15.5px;max-width:34ch}
.cta{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px;margin-top:14px}
.suggest{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:560px;margin:0 auto}
.sg{text-align:left;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;transition:background .15s}
.sg b{font-weight:500;font-size:14.5px;color:var(--fg)}
.sg span{font-size:13px;color:var(--muted);line-height:1.35}
.sg:active{background:var(--raised)}

/* composer */
.composer-wrap{flex:0 0 auto;position:relative;padding-top:4px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.editing{max-width:760px;margin:0 auto 6px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 4px 14px;border-radius:14px;background:var(--raised);font-size:13.5px;color:var(--fg-soft)}
.editing .icon-btn{width:34px;height:34px}
.editing .ic{width:17px;height:17px}
.composer{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:6px 8px 8px;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:#35353b;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 8%,transparent)}
.composer textarea{display:block;width:100%;background:none;border:0;outline:0;resize:none;padding:9px 10px 6px;max-height:38vh;line-height:1.5;font-size:16.5px}
.composer textarea::placeholder{color:var(--faint)}
.c-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.model-chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;border-radius:999px;background:var(--raised);font-size:14px;font-weight:500;color:var(--fg-soft);min-width:0;max-width:100%;transition:background .15s}
.c-side{display:flex;align-items:center;gap:6px;min-width:0}
.c-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--fg-soft);flex:0 0 auto;transition:background .15s,color .15s}
.c-btn .ic{width:19px;height:19px}
.c-btn:active{background:var(--raised)}
.c-btn.on{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.attach-row{display:flex;gap:10px;flex-wrap:wrap;padding:8px 8px 2px}
.att{position:relative;display:flex;align-items:center;gap:8px;height:52px;padding:0 14px;border-radius:14px;background:var(--raised);font-size:13px;color:var(--fg-soft);max-width:220px}
.att.img{padding:0;width:52px}
.att img{width:52px;height:52px;border-radius:14px;object-fit:cover;display:block}
.att span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--fg);color:#000;display:grid;place-items:center}
.att .x .ic{width:12px;height:12px;stroke-width:2.6}
.msg-imgs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:86%}
.msg-imgs img{width:132px;height:132px;object-fit:cover;border-radius:16px;display:block}
.msg-files{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:86%}
.fchip{font-size:12.5px;color:var(--fg-soft);background:var(--raised);border-radius:10px;padding:6px 10px;display:inline-flex;gap:6px;align-items:center}
.fchip .ic{width:13px;height:13px}
.act.on{color:var(--accent)}
.model-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.model-chip .dot.off{background:var(--faint)}
.model-chip .ic{width:16px;height:16px;color:var(--muted)}
.model-chip:active{background:var(--raised-2)}
.send{width:40px;height:40px;border-radius:50%;background:var(--fg);color:#000;display:grid;place-items:center;flex:0 0 auto;transition:transform .15s,opacity .2s}
.send .ic{width:20px;height:20px;stroke-width:2.3}
.send.stop .ic{width:15px;height:15px}
.send:disabled{opacity:.22;cursor:default}
.send:not(:disabled):active{transform:scale(.92)}
.hint{text-align:center;color:var(--faint);font-size:12px;margin-top:8px}
.to-bottom{position:absolute;left:50%;top:-46px;width:38px;height:38px;border-radius:50%;background:var(--raised-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transform:translateX(-50%) scale(.85);transition:opacity .2s,transform .2s var(--ease)}
.to-bottom.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
.to-bottom .ic{width:18px;height:18px}

/* layers: shared open and close rules */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity var(--d) var(--ease),visibility 0s linear var(--d)}
.scrim.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity var(--d) var(--ease),visibility 0s}
.layer{visibility:hidden;transition:transform var(--d) var(--ease),opacity var(--d) var(--ease),visibility 0s linear var(--d)}
.layer.on{visibility:visible;transition:transform var(--d) var(--ease),opacity var(--d) var(--ease),visibility 0s}
.layer:not(.on),.layer.settling{pointer-events:none}

/* drawer */
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);background:var(--surface);border-right:1px solid var(--line-soft);transform:translateX(-100%);display:flex;flex-direction:column;
  padding:max(12px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.drawer.on{transform:none}
.d-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.logo-flat{display:block;width:24px;height:24px;flex:0 0 auto;background:var(--logo,#f5f5f4);-webkit-mask:url(icons/logo.svg) center/contain no-repeat;mask:url(icons/logo.svg) center/contain no-repeat}
.d-brand b{font-size:19px;font-weight:600;letter-spacing:-.02em}
.d-search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px;margin-bottom:6px}
.d-search .ic{width:17px;height:17px;color:var(--faint)}
.d-search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15.5px}
.d-search input::placeholder{color:var(--faint)}
.d-new{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;font-size:15px;font-weight:500}
.d-new .ic{color:var(--fg-soft)}
.d-new:active{background:var(--raised)}
.chat-list{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0}
.d-label{font-size:12.5px;font-weight:500;color:var(--faint);padding:14px 12px 4px}
.ci{display:flex;align-items:center;border-radius:12px}
.ci.active{background:var(--raised)}
.ci .open{flex:1;min-width:0;text-align:left;padding:10px 12px;font-size:15px;color:var(--fg-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci.active .open{color:var(--fg)}
.ci .more{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--faint);flex:0 0 auto}
.ci .more .ic{width:18px;height:18px}
.ci .more:active{background:var(--raised-2);color:var(--fg)}
.empty-list{color:var(--faint);font-size:14px;padding:12px}
.d-foot{border-top:1px solid var(--line-soft);padding-top:8px;margin-top:6px}
.d-foot button{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;font-size:15px;color:var(--fg-soft)}
.d-foot button:active{background:var(--raised)}

/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);border-radius:26px 26px 0 0;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(100%)}
.sheet.on{transform:none}
.sheet.dragging{transition:none}
@media (min-width:720px){.sheet{left:50%;right:auto;width:560px;margin-left:-280px}}
.grab{padding:10px 0 4px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab i{width:38px;height:4px;border-radius:4px;background:var(--line)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 6px 20px;touch-action:none}
.sheet-head h2{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:2px 10px max(18px,env(safe-area-inset-bottom,0px))}
.msearch{margin:2px 0 6px}
.mgroup{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px}
.mrow{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;text-align:left;min-height:52px}
.mrow .tx{flex:1;min-width:0}
.mrow b{display:block;font-weight:500;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .tx span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow > .ic{color:var(--muted)}
.mrow .check{color:var(--accent)}
.mrow .chev{width:18px;height:18px;color:var(--faint)}
.mrow .tag{font-size:13px;color:var(--accent);white-space:nowrap}
.mrow.sel{background:var(--raised)}
.mrow:active{background:var(--raised)}
.mrow.danger b,.mrow.danger > .ic{color:var(--danger)}
.mempty{color:var(--muted);font-size:14.5px;padding:14px 12px}

/* companions */
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:17px;color:#0b0b0c;flex:0 0 auto;letter-spacing:-.01em}
.avatar.sm{width:22px;height:22px;font-size:11px}
.avatar.lg{width:64px;height:64px;font-size:26px}
.avatar.xl{width:108px;height:108px;font-size:42px}
.avatar.photo{background-size:cover;background-position:center;background-repeat:no-repeat;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ring)}
.avatar.sm.photo{box-shadow:0 0 0 1.5px var(--ring)}
.av-edit{position:relative;border-radius:50%}
.av-edit .cam{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--fg);color:#000;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.av-edit .cam .ic{width:17px;height:17px}
.av-acts{display:flex;gap:6px}
.av-acts button{height:34px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--fg-soft)}
.av-acts button:active{background:var(--raised)}
.tone{padding:16px 16px 18px;display:flex;flex-direction:column;gap:18px}
.tone label{display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--muted)}
.tone input{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:999px;margin:0;outline:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.tone input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 28%,transparent),0 6px 16px rgba(0,0,0,.55);cursor:grab}
.tone input::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 28%,transparent)}
.tone input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 45%,transparent)}
.hue-in{background:linear-gradient(90deg,#ff8a8a,#ffc46b,#f5ec7a,#7ee8a0,#6ee0e0,#6ea8ff,#a98cff,#f59ae6,#ff8a8a)}
.d-new .beta{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:3px 8px;border-radius:999px}
.soon{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 20px 40px;gap:12px}
.soon .orb{position:relative;width:200px;height:200px;display:grid;place-items:center;margin-bottom:18px;animation:drift 6s ease-in-out infinite}
.soon .orb::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(closest-side,var(--glow,rgba(110,140,255,.38)),transparent 72%);animation:breathe 4s ease-in-out infinite}
.soon .orb img{position:relative;width:150px;height:auto;filter:drop-shadow(0 16px 44px var(--glow,rgba(110,140,255,.38)));animation:spin 18s linear infinite}
.soon h3{margin:0;font-size:28px;font-weight:600;letter-spacing:-.03em}
.soon p{margin:0;color:var(--muted);font-size:15px;max-width:30ch;line-height:1.5}
.soon .chip{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:4px 10px;border-radius:999px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tilt{0%,100%{transform:perspective(700px) rotateY(-16deg) rotateX(5deg)}50%{transform:perspective(700px) rotateY(16deg) rotateX(-5deg)}}
@keyframes glint{0%,30%{background-position:160% 0}75%,100%{background-position:-60% 0}}
.soon .mk{position:relative;width:150px;animation:tilt 8s ease-in-out infinite}
.soon .mk img{display:block;width:100%;height:auto;filter:drop-shadow(0 16px 44px var(--glow,rgba(110,140,255,.38)))}
.soon .mk::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%);background-size:260% 100%;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;animation:glint 5s ease-in-out infinite;mix-blend-mode:screen}
.vb{display:inline-block;width:16px;height:16px;flex:0 0 auto;vertical-align:-2px;margin-left:4px}
.comp b .vb{width:17px;height:17px}
.comp .tx b span{display:inline;font-size:inherit;color:inherit;white-space:normal}
.prof{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 0 8px}
.prof .avatar{width:132px;height:132px;font-size:52px;margin-bottom:10px}
.prof h3{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em;display:inline-flex;align-items:center}
.prof h3 .vb{width:21px;height:21px;margin-left:6px}
.prof .tg{font-size:14px;color:var(--accent);font-weight:500}
.prof .off{font-size:12.5px;color:var(--faint)}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.bgs button{aspect-ratio:9/14;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);background-size:cover;background-position:center;position:relative;font-size:12.5px;color:var(--fg-soft);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.bgs button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.bgs button .ic{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:22px;height:22px}
.upd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:6px 4px 4px}
.upd .dl{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);margin-bottom:6px}
.upd .dl .ic{width:30px;height:30px}
.upd h3{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em}
.upd p{margin:0;color:var(--muted);font-size:14.5px}
.upd ul{text-align:left;margin:8px 0 4px;padding:0 0 0 20px;color:var(--fg-soft);font-size:14.5px;line-height:1.6;align-self:stretch}
.upd .btn .ic{width:18px;height:18px}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.soon .orb,.soon .orb::before,.soon .mk,.soon .mk::after{animation:none}}
.comp-list{display:flex;flex-direction:column;gap:8px}
.comp{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 8px;border-radius:20px;background:var(--surface);border:1px solid var(--line-soft)}
.comp .go{flex:1;min-width:0;display:flex;align-items:center;gap:14px;text-align:left;padding:8px 6px;border-radius:14px}
.comp .go:active{background:var(--raised)}
.comp .tx{min-width:0;flex:1}
.comp b{display:block;font-weight:600;font-size:16px;letter-spacing:-.01em}
.comp .tx span{display:block;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp .tx i{font-style:normal;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:1px}
.comp .more{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--faint)}
.comp .more:active{background:var(--raised);color:var(--fg)}
.top-comp{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--fg);max-width:100%}
.top-comp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .open{display:flex;align-items:center;gap:9px}
.ci .open > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatches{display:flex;gap:12px;flex-wrap:wrap;padding:14px 16px}
.swatch{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);outline:2px solid transparent;outline-offset:3px;transition:outline-color .15s}
.swatch[aria-pressed="true"]{outline-color:var(--fg)}
.comp-hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 4px}
/* memory */
.memtag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:12.5px;color:var(--muted);margin-left:6px}
.memtag .ic{width:14px;height:14px;color:var(--accent)}
.memtag:active{background:var(--raised)}
.memrow{display:flex;align-items:flex-start;gap:10px;padding:12px 8px 12px 16px}
.memrow p{flex:1;margin:4px 0 0;font-size:15px;line-height:1.5;color:var(--fg-soft);overflow-wrap:anywhere}
/* model advisor */
.rec{padding:16px;display:flex;flex-direction:column;gap:8px}
.rec .k{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.rec b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.rec p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.cmd{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;margin-top:4px}
.cmd code{flex:1;font-family:var(--mono);font-size:13px;color:var(--fg-soft);overflow-x:auto;white-space:nowrap}
details.more-opts{margin-top:22px}
details.more-opts summary{list-style:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--faint);padding:6px;display:inline-flex;align-items:center;gap:6px}
details.more-opts summary::-webkit-details-marker{display:none}
details.more-opts summary .ic{width:15px;height:15px;transition:transform .2s}
details.more-opts[open] summary .ic{transform:rotate(180deg)}
details.more-opts .group{margin-top:8px}

/* models on this PC (Windows app) */
.pcspec{display:flex;align-items:center;gap:14px;padding:16px}
.pcspec .tx b{display:block;font-weight:600;font-size:16px}
.pcspec .tx span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.pcm{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px}
.pcm .tx{flex:1;min-width:0}
.pcm .tx b{display:block;font-weight:500;font-size:15.5px}
.pcm .tx span{display:block;font-size:13px;color:var(--muted)}
.pcm .btn{height:38px;padding:0 14px;font-size:14px;flex:0 0 auto}
.pcm .btn.on{background:color-mix(in srgb,var(--accent) 18%,var(--raised));color:var(--fg)}

/* learn */
.learn-hero{padding:8px 4px 6px}
.learn-hero h3{margin:0;font-size:26px;font-weight:600;letter-spacing:-.025em}
.learn-hero p{margin:6px 0 0;color:var(--muted);font-size:15px;line-height:1.5}
.lcards{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px}
@media (min-width:620px){.lcards{grid-template-columns:1fr 1fr}}
.lcard{text-align:left;border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line-soft);display:flex;flex-direction:column;transition:transform .15s}
.lcard:active{transform:scale(.985)}
.lthumb{position:relative;height:168px;overflow:hidden;background:radial-gradient(80% 90% at 85% 110%,color-mix(in srgb,var(--accent) 45%,transparent),transparent 70%),linear-gradient(160deg,var(--raised-2),#050506)}
.lthumb img.shot{position:absolute;right:18px;top:22px;width:46%;border-radius:14px 14px 0 0;box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
.lthumb .logos{position:absolute;left:16px;bottom:16px;display:flex;gap:6px}
.lthumb .mins{position:absolute;left:16px;top:16px;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);font-size:12.5px;font-weight:500;color:#e8e8e6}
.lthumb .mins .ic{width:13px;height:13px}
.lcard .lbody{padding:14px 16px 16px}
.lcard .lbody b{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.lcard .lbody span{display:block;font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.blogo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.blogo svg{width:19px;height:19px}
.blogo.txt{font-size:10.5px;font-weight:700;letter-spacing:-.01em;color:#fff}
.lstep{display:flex;flex-direction:column;gap:12px;padding:18px 0;border-top:1px solid var(--line-soft)}
.lstep:first-of-type{border-top:0}
.lstep .n{display:flex;align-items:center;gap:12px}
.lstep .n i{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px;flex:0 0 auto}
.lstep .n b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.lstep p{margin:0;color:var(--fg-soft);font-size:15px;line-height:1.6}
.lstep img{width:min(300px,78%);align-self:center;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.verdict{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.verdict .tx{flex:1;min-width:0}
.verdict .tx b{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:600}
.verdict .tx p{margin:3px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5}
.vtag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.vtag .ic{width:12px;height:12px}
.vtag.yes{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.vtag.no{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}

/* app icon picker */
.icons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.ico{display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 6px 12px;border-radius:18px;border:1px solid transparent;font-size:14px;font-weight:500;color:var(--fg-soft);transition:background .15s,border-color .15s}
.ico img{width:72px;height:72px;border-radius:17px;box-shadow:0 10px 24px rgba(0,0,0,.55)}
.ico:active{background:var(--raised)}
.ico[aria-pressed="true"]{border-color:color-mix(in srgb,var(--accent) 70%,transparent);background:var(--raised);color:var(--fg)}

/* full screen page */
.page{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);padding-top:env(safe-area-inset-top,0px)}
.page.on{transform:none}
.page-head{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:56px;padding:0 4px;flex:0 0 auto}
.page-head h2{margin:0;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px max(36px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column}

/* dialog */
.dialog{position:fixed;left:50%;top:50%;width:min(360px,calc(100vw - 40px));transform:translate(-50%,-46%) scale(.96);opacity:0;background:#151517;border:1px solid var(--line);border-radius:24px;padding:22px 18px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.dialog.on{transform:translate(-50%,-50%);opacity:1}
.dialog h3{margin:0 2px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.dialog p{margin:0 2px;color:var(--muted);font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.dialog .btns{justify-content:flex-end;margin-top:8px}

/* settings building blocks */
.glabel{font-size:13px;font-weight:500;color:var(--muted);padding:22px 6px 8px}
.glabel:first-child{padding-top:10px}
.group{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;overflow:hidden}
.group > * + *{border-top:1px solid var(--line-soft)}
.row{width:100%;display:flex;align-items:center;gap:14px;min-height:56px;padding:12px 16px;text-align:left}
.row > .ic{color:var(--muted)}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .tx b{font-weight:500;font-size:15.5px}
.row .tx span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{font-size:14px;color:var(--muted);white-space:nowrap}
.row .val.ok{color:var(--accent)}
.row .chev{width:18px;height:18px;color:var(--faint)}
button.row:active{background:var(--raised)}
.row.danger b,.row.danger > .ic{color:var(--danger)}
.gnote{font-size:13px;color:var(--muted);padding:10px 6px 0;line-height:1.55}
.field{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.field > label,.flabel{font-size:13px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.flabel em{font-style:normal;color:var(--fg)}
.field small{color:var(--muted);font-size:13px;line-height:1.5}
.inrow{display:flex;gap:8px;align-items:center}
.inrow .input{flex:1;min-width:0}
.switch{width:48px;height:30px;border-radius:999px;background:var(--raised-2);position:relative;flex:0 0 auto;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#cfcfcc;transition:transform .22s var(--ease),background .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border-radius:11px;font-size:14px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--raised-2);color:var(--fg)}
.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:0;font-size:16px}
.input:focus{border-color:#3d3d44}
.input::placeholder{color:var(--faint)}
textarea.input{resize:vertical;min-height:110px;line-height:1.5}
select.input{appearance:none;background-image:none}
.btn{height:46px;padding:0 18px;border-radius:14px;background:var(--raised);font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn .ic{width:17px;height:17px}
.btn:active{background:var(--raised-2)}
.btn.primary{background:var(--fg);color:#000}
.btn.primary:active{background:#fff}
.btn.ghost{background:none;color:var(--fg-soft)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:13.5px;color:var(--muted);line-height:1.5}
.status:empty{display:none}
.status.bad{color:var(--danger)}
.status.good{color:var(--ok)}
.codechip{font-family:var(--mono);font-size:12.5px;background:var(--raised);padding:2px 7px;border-radius:6px;color:var(--fg-soft);word-break:break-all}
.steps{margin:0;padding-left:1.25em;color:var(--fg-soft);font-size:14.5px;line-height:1.6}
.steps li{margin:.2em 0}
.range{width:100%;accent-color:var(--accent)}
.range-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--faint)}

.toast{position:fixed;left:50%;bottom:calc(122px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--fg);color:#000;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);z-index:500;max-width:calc(100vw - 40px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

async function generate(){

  const len = LENGTHS.find(l => l.id === S.len) || LENGTHS[1];

  const hasImg = history.some(x => Array.isArray(x.content));
  if (history.length && history[0].role === "assistant") history.unshift({role:"user", content:"Hi."});
  const payload = {model:m.id, stream:true, temperature:S.temp, max_tokens:len.tokens, messages:[{role:"system", content:systemPrompt(c)}].concat(history)};

  busy = true; busyChat = c.id; syncSend();
  const wrap = h("div", {class:"msg ai"}); const ans = h("div", {class:"answer", html:`<span class="thinking"><span class="shimmer">Thinking</span></span>`});
  wrap.append(ans); live = wrap; inner.append(wrap); stickDown(true);
  controller = new AbortController();
  let text = "", reasoning = "", t0 = 0, secs = 0, raf = 0, rEl = null, body = null, aborted = false, fail = null;
  const paint = () => {
    raf = 0;
    if (reasoning && S.thinking) {
      if (!rEl) { ans.innerHTML = ""; rEl = reasonEl("", 0, true); ans.append(rEl); }
      rEl.querySelector(".rtext").textContent = reasoning;
      if (text && !rEl.dataset.done) { rEl.dataset.done = "1"; rEl.querySelector("summary").innerHTML = `<span>Thought for ${secs || 1}s</span>` + ic("chevron-down"); }
    }
    if (text) {

      body.innerHTML = md(visibleText(text)); decorate(body);
    }
    if (wrap.isConnected) stickDown(false);

  const sched = () => { if (!raf) raf = requestAnimationFrame(paint); };
  try {
    if (P.id === "pc") {
      if (!DESKTOP) throw {friendly:"This model runs only in the Vesper app on your PC. Pick another model here."};
      ans.innerHTML = `<span class="thinking"><span class="shimmer">Loading the model</span></span>`;
      try { await pcEnsure(m.id); } catch (e) { throw {friendly:String(e && e.message || e)}; }
      Object.assign(P, provOf("pc"));
      ans.innerHTML = `<span class="thinking"><span class="shimmer">Thinking</span></span>`;
    }
    const res = await apiFetch(P, "/chat/completions", {method:"POST", signal:controller.signal, headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
    if (!res.ok) {

          const r = typeof d.reasoning === "string" ? d.reasoning : (typeof d.reasoning_content === "string" ? d.reasoning_content : "");

  } catch (err) {

  }

/* attachments: photos are shrunk on this device before sending; text files are read and sent as text */
let pending = [];
function toApi(x){
  if (x.role !== "user" || (!x.images && !x.files)) return {role:x.role, content:x.content};
  let t = x.content || "";
  (x.files || []).forEach(f => { t += "\n\nFile: " + f.name + "\n```\n" + f.text + "\n```"; });
  t = t.trim();
  if (!x.images || !x.images.length) return {role:"user", content:t};
  return {role:"user", content:[{type:"text", text:t || "Describe this image."}].concat(x.images.map(u => ({type:"image_url", image_url:{url:u}})))};
}
async function shrinkImage(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1024 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);

}

    row.append(a.kind === "image" ? h("div", {class:"att img"}, h("img", {src:a.url, alt:a.name}), x) : h("div", {class:"att"}, icEl("paperclip"), h("span", {text:a.name}), x));

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

$("#micBtn").onclick = () => {

    rec = new SpeechRec(); rec.lang = navigator.language || "en-US"; rec.interimResults = true; rec.continuous = false;
    const base = input.value ? input.value.replace(/\s+$/, "") + " " : "";

    rec.onerror = ev => { if (ev.error === "not-allowed") toast("Allow the microphone to talk to Vesper"); };
    rec.onend = () => { rec = null; $("#micBtn").classList.remove("on"); };

/* read aloud, on this device */
function plainText(t){ return String(t).replace(/```[\s\S]*?```/g, " ").replace(/`([^`]+)`/g, "$1").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/[#*_>~|]/g, "").replace(/\s+/g, " ").trim(); }
function speak(text, btn){
  const ss = window.speechSynthesis;
  if (ss.speaking) { ss.cancel(); document.querySelectorAll(".act.on").forEach(b => b.classList.remove("on")); if (btn.dataset.speaking) { delete btn.dataset.speaking; return; } }
  const u = new SpeechSynthesisUtterance(plainText(text));
  u.onend = u.onerror = () => { btn.classList.remove("on"); delete btn.dataset.speaking; };
  btn.classList.add("on"); btn.dataset.speaking = "1"; ss.speak(u);
}

function adviseModels(ram, vram, list){
  const gpuFit = vram >= 4 ? vram * 0.85 : 0;
  const cpuFit = ram * 0.5;
  const fits = gb => gb <= Math.max(gpuFit, cpuFit);
  const okList = list.filter(m => fits(m.gb));
  const best = okList[okList.length - 1] || list[0];
  const fastPool = gpuFit ? list.filter(m => m.gb <= gpuFit) : list.filter(m => m.gb <= Math.min(cpuFit, 5.5));
  const fast = fastPool[fastPool.length - 1] || list[0];
  return {best, fast, bestOnGpu:!!gpuFit && best.gb <= gpuFit};
}

// Brands without a free logo get a clean name badge instead of an imitation.
const BADGES = {openai:{name:"OpenAI", bg:"#0f0f10", txt:"OpenAI"}, groq:{name:"Groq", bg:"#f55036", txt:"Groq"}, cerebras:{name:"Cerebras", bg:"#f05a28", txt:"CS"}};
function brandLogo(id){
  const b = BRANDS[id];
  if (b) {
    const dark = id === "ollama" || id === "openrouter";
    return h("span", {class:"blogo", title:b.name, style:"background:" + (dark ? "#1b1b1e" : b.hex + "22"), html:`<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="${dark ? "#f5f5f4" : b.hex}" d="${b.d}"/></svg>`});
  }
  const t = BADGES[id] || {name:id, bg:"#222", txt:id};
  return h("span", {class:"blogo txt", title:t.name, style:"background:" + t.bg, text:t.txt});
}

}
function openGuide(g){
  open("guide:" + g.id, () => makePage(g.title, w => {
    w.append(h("div", {class:"lthumb", style:"border-radius:22px;height:190px"}, h("img", {class:"shot", src:learnImg(g.shot), alt:""}), h("span", {class:"mins", html:ic("clock") + g.mins + " min"}), g.logos.length ? h("div", {class:"logos"}, ...g.logos.map(brandLogo)) : null),
      h("div", {class:"learn-hero", style:"padding-top:16px"}, h("p", {text:g.sub})));
    if (g.steps) g.steps.forEach(([img, t, d], i) => w.append(h("div", {class:"lstep"}, h("div", {class:"n"}, h("i", {text:String(i + 1)}), h("b", {text:t})), h("p", {text:d}), img ? h("img", {src:learnImg(img), alt:t, loading:"lazy"}) : null)));
    if (g.verdicts) g.verdicts.forEach(([label, list]) => w.append(glabel(label), group(...list.map(([yes, brand, name, why]) => h("div", {class:"verdict"}, brandLogo(brand),
      h("div", {class:"tx"}, h("b", {}, h("span", {text:name}), h("span", {class:"vtag " + (yes ? "yes" : "no"), html:ic(yes ? "circle-check" : "circle-x") + (yes ? "Worth it" : "Skip")})), h("p", {text:why})))))));
    if (g.verdicts) w.append(gnote("Our picks as of November 2026. Models improve fast, so Vesper's Best for this PC suggestions always come first."));
    if (g.go) w.append(h("div", {style:"padding-top:20px"}, h("button", {class:"btn primary block", type:"button", text:g.go[0], onclick:g.go[1]})));
  }));
}
$("#openLearn").onclick = () => openLearn(true);

/* app icon */
function applyIcon(){
  const i = ICONS.find(x => x.id === S.icon) || ICONS[0];
  $("#lnkManifest").href = i.id === "chrome" ? "manifest.webmanifest" : "manifest-" + i.id + ".webmanifest";
  $("#lnkIcon").href = iconFile("icon-192.png"); $("#lnkTouch").href = iconFile("icon-192.png");
  const st = document.documentElement.style;
  st.setProperty("--logo", i.tint); st.setProperty("--accent", i.accent); st.setProperty("--glow", i.glow);
  st.setProperty("--surface", i.surface); st.setProperty("--raised", i.raised); st.setProperty("--raised-2", i.raised2);
  st.setProperty("--sheet", i.sheet); st.setProperty("--line", i.line); st.setProperty("--line-soft", i.lineSoft);
  const hm = document.querySelector(".hero .mark"); if (hm) hm.src = iconFile("mark.webp");
  if (DESKTOP && TAURI.window) fetch(iconFile("icon-512.png")).then(r => r.arrayBuffer()).then(b => TAURI.window.getCurrentWindow().setIcon(new Uint8Array(b))).catch(() => {});
}
function openIcons(){
  open("icons", () => makePage("App icon", (w, L) => {
    const grid = h("div", {class:"icons", role:"group", "aria-label":"App icon"});
    ICONS.forEach(i => grid.append(h("button", {class:"ico", type:"button", "aria-pressed":String(S.icon === i.id), onclick:() => {
      if (S.icon === i.id) return;
      S.icon = i.id; save(); applyIcon(); L.refresh(); toast(i.name + " icon set");
    }}, h("img", {src:"icons/" + i.id + "/preview.webp", alt:"", width:"72", height:"72", loading:"lazy"}), h("span", {text:i.name}))));
    w.append(glabel("Choose a finish"), group(grid),
      gnote(DESKTOP ? "Changes the logo, the taskbar icon and the colors of the whole app right away." : "Changes the logo and the colors of the whole app right away. Your home screen icon changes when you add Vesper to your home screen again: remove it, then use Add to Home screen in Chrome."));
  }));
}

/* data */
function exportChats(){
  const data = {app:"Vesper", version:3, exported:new Date().toISOString(), chats:S.chats.filter(c => !c.temp && c.messages.length), companions:S.companions, memory:S.memory};
  const a = h("a", {href:URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type:"application/json"})), download:"vesper-chats-" + new Date().toISOString().slice(0, 10) + ".json"});
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast("Backup saved");
}
$("#importFile").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); const list = Array.isArray(j) ? j : j.chats;
    if (!Array.isArray(list)) throw 0;
    let n = 0;
    if (!Array.isArray(j) && Array.isArray(j.companions)) j.companions.forEach(k => { if (k && k.id && k.name && !compById(k.id)) S.companions.push({id:String(k.id), name:String(k.name).slice(0, 40), about:String(k.about || ""), style:String(k.style || ""), story:String(k.story || ""), greeting:String(k.greeting || ""), color:/^#[0-9a-f]{6}$/i.test(k.color) ? k.color : COMP_COLORS[0], photo:PHOTO_RE.test(k.photo || "") && k.photo.length < 400000 ? k.photo : undefined}); });
    if (!Array.isArray(j) && Array.isArray(j.memory)) addMemories(j.memory.map(m => m && m.text).filter(Boolean).map(String));
    list.forEach(c => {
      if (!c || !c.id || !Array.isArray(c.messages) || S.chats.some(x => x.id === c.id)) return;
      const nc = {id:String(c.id), title:String(c.title || "Imported chat"), model:c.model, updated:+c.updated || Date.now(), companion:c.companion && compById(String(c.companion)) ? String(c.companion) : undefined,
        messages:c.messages.filter(m => m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string").map(m => Object.assign({}, m))};
      S.chats.push(nc); n++;
    });
    fixModels(); save(); renderDrawer(); toast(n ? "Imported " + n + " chat" + (n === 1 ? "" : "s") : "Nothing new to import");
  } catch (err) { toast("That file isn't a Vesper backup"); }
});

/* toast */
let tt = 0;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 2000); }

/* boot */
function syncEnterHint(){ input.setAttribute("enterkeyhint", enterSends() ? "send" : "enter"); }
syncEnterHint();
applyIcon();
applyBg();
history.replaceState({vd:0}, "");
refreshMain();
if (DESKTOP) pcList();
else if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
