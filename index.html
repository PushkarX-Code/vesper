<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Vesper</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" as="image" href="mark.webp" type="image/webp">
<style>
/* Vesper. One column chat: header, thread, composer. Pure black, Inter, one blue accent from the logo.
   Every panel (drawer, sheet, page, dialog) is a "layer": it cannot be tapped while it animates or once it closes. */
@font-face{font-family:"Inter";src:url("fonts/inter-var.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{
  --bg:#000000;
  --surface:#0f0f11;
  --raised:#18181b;
  --raised-2:#222226;
  --sheet:#111113;
  --line:#26262a;
  --line-soft:#1a1a1d;
  --fg:#f5f5f4;
  --fg-soft:#cfcfcc;
  --muted:#939391;
  --faint:#646462;
  --accent:#6ea8ff;
  --danger:#ff7a6b;
  --ok:#7fd8a0;
  --ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.32,.72,0,1);
  --d:300ms;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
svg{display:block}
.ic{width:20px;height:20px;flex:0 0 auto}

.app{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top,0px)}

/* header */
.top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:56px;flex:0 0 auto;
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.top-center{display:flex;justify-content:center;min-width:0}
.top-title{font-size:15px;font-weight:600;color:var(--fg-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.priv{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;background:var(--raised);font-size:13.5px;font-weight:500;color:var(--fg-soft)}
.priv .ic{width:16px;height:16px;color:var(--accent)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg-soft);transition:background .15s,color .15s}
.icon-btn:active{background:var(--raised);color:var(--fg)}
.icon-btn.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}

/* thread */
.thread{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.thread-inner{max-width:760px;margin:0 auto;padding:10px 0 26px;display:flex;flex-direction:column;gap:22px;min-height:100%}

.msg{display:flex;flex-direction:column;gap:4px;animation:rise .28s var(--ease) both}
.msg.user{align-items:flex-end}
.bubble{max-width:86%;background:var(--raised);padding:10px 16px;border-radius:22px 22px 8px 22px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;cursor:pointer}
.answer{min-width:0;font-size:16.5px;line-height:1.65;overflow-wrap:anywhere}
.answer p{margin:0 0 .85em}
.answer .md > :last-child{margin-bottom:0}
.answer strong{font-weight:600}
.answer em{color:var(--fg-soft)}
.answer ul,.answer ol{margin:0 0 .85em;padding-left:1.35em}
.answer li{margin:.3em 0}
.answer h1,.answer h2,.answer h3,.answer h4{font-weight:600;line-height:1.3;letter-spacing:-.01em;margin:1.2em 0 .5em;text-wrap:balance}
.answer h1{font-size:1.3em}.answer h2{font-size:1.17em}.answer h3,.answer h4{font-size:1.04em}
.answer blockquote{margin:0 0 .85em;padding-left:14px;border-left:2px solid var(--line);color:var(--fg-soft)}
.answer code{font-family:var(--mono);font-size:.86em;background:var(--raised);padding:.14em .42em;border-radius:6px}
.answer pre{margin:0;padding:12px 14px;overflow-x:auto;line-height:1.55}
.answer pre code{background:none;padding:0;font-size:13.5px}
.answer a{color:var(--accent);text-underline-offset:2px}
.answer hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.answer table{border-collapse:collapse;display:block;overflow-x:auto;margin-bottom:.85em;font-size:15px}
.answer th,.answer td{border:1px solid var(--line);padding:7px 11px;text-align:left}
.answer th{font-weight:600;background:var(--surface)}
.code{margin:0 0 .9em;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 14px;border-bottom:1px solid var(--line-soft);font-size:12.5px;color:var(--muted)}
.code-copy{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--muted)}
.code-copy .ic{width:14px;height:14px}
.code-copy:active{background:var(--raised);color:var(--fg)}

.acts{display:flex;align-items:center;gap:2px;margin-left:-8px;min-height:34px}
.msg.user .acts{margin:0 -6px 0 0;height:0;min-height:0;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .2s}
.msg.user.open .acts{height:36px;opacity:1;pointer-events:auto}
.act{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.act .ic{width:17px;height:17px}
.act:active{background:var(--raised);color:var(--fg)}
.by{font-size:12.5px;color:var(--faint);margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.thinking{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:15px}
.wave{width:34px;height:14px;flex:0 0 auto;fill:none;stroke-width:2.4;stroke-linecap:round}
.wave .track{stroke:color-mix(in srgb,var(--accent) 24%,var(--line))}
.wave .run{stroke:var(--accent);stroke-dasharray:20 40;animation:flow 1.25s linear infinite}
.shimmer{background:linear-gradient(90deg,var(--faint) 0%,var(--fg-soft) 50%,var(--faint) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.6s linear infinite}

.reason{margin:0 0 12px}
.reason summary{list-style:none;cursor:pointer;color:var(--muted);font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.reason summary::-webkit-details-marker{display:none}
.reason summary .ic{width:15px;height:15px;transition:transform .2s}
.reason[open] summary .ic{transform:rotate(180deg)}
.reason .rtext{margin-top:6px;padding-left:12px;border-left:2px solid var(--line);color:var(--muted);font-size:14px;line-height:1.6;white-space:pre-wrap;max-height:280px;overflow:auto}

.errcard{border:1px solid color-mix(in srgb,var(--danger) 30%,var(--line));background:color-mix(in srgb,var(--danger) 6%,var(--surface));border-radius:18px;padding:14px 14px 12px 16px;display:flex;flex-direction:column;gap:12px}
.errcard p{margin:0;color:var(--fg-soft);font-size:15px;line-height:1.5}
.errcard .pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:36px;padding:0 14px 0 12px;border-radius:999px;background:var(--raised);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.pill .ic{width:16px;height:16px;color:var(--muted)}
.pill:active{background:var(--raised-2)}

/* empty state */
.hero{flex:1;display:flex;flex-direction:column;min-height:100%}
.hero-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:28px 0 20px}
.hero .mark{height:84px;width:auto;filter:drop-shadow(0 14px 40px rgba(110,140,255,.38));animation:drift 7s ease-in-out infinite}
.hero h1{font-size:clamp(28px,8vw,36px);font-weight:600;letter-spacing:-.025em;line-height:1.12;margin:10px 0 0;text-wrap:balance}
.hero h1 i{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--muted);font-size:15.5px;max-width:34ch}
.cta{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px;margin-top:14px}
.suggest{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:560px;margin:0 auto}
.sg{text-align:left;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;transition:background .15s}
.sg b{font-weight:500;font-size:14.5px;color:var(--fg)}
.sg span{font-size:13px;color:var(--muted);line-height:1.35}
.sg:active{background:var(--raised)}

/* composer */
.composer-wrap{flex:0 0 auto;position:relative;padding-top:4px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.editing{max-width:760px;margin:0 auto 6px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 4px 14px;border-radius:14px;background:var(--raised);font-size:13.5px;color:var(--fg-soft)}
.editing .icon-btn{width:34px;height:34px}
.editing .ic{width:17px;height:17px}
.composer{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:6px 8px 8px;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:#35353b;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 8%,transparent)}
.composer textarea{display:block;width:100%;background:none;border:0;outline:0;resize:none;padding:9px 10px 6px;max-height:38vh;line-height:1.5;font-size:16.5px}
.composer textarea::placeholder{color:var(--faint)}
.c-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.model-chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;border-radius:999px;background:var(--raised);font-size:14px;font-weight:500;color:var(--fg-soft);min-width:0;max-width:72%;transition:background .15s}
.model-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.model-chip .dot.off{background:var(--faint)}
.model-chip .ic{width:16px;height:16px;color:var(--muted)}
.model-chip:active{background:var(--raised-2)}
.send{width:40px;height:40px;border-radius:50%;background:var(--fg);color:#000;display:grid;place-items:center;flex:0 0 auto;transition:transform .15s,opacity .2s}
.send .ic{width:20px;height:20px;stroke-width:2.3}
.send.stop .ic{width:15px;height:15px}
.send:disabled{opacity:.22;cursor:default}
.send:not(:disabled):active{transform:scale(.92)}
.hint{text-align:center;color:var(--faint);font-size:12px;margin-top:8px}
.to-bottom{position:absolute;left:50%;top:-46px;width:38px;height:38px;border-radius:50%;background:var(--raised-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transform:translateX(-50%) scale(.85);transition:opacity .2s,transform .2s var(--ease)}
.to-bottom.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
.to-bottom .ic{width:18px;height:18px}

/* layers: shared open and close rules */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity var(--d) var(--ease),visibility 0s linear var(--d)}
.scrim.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity var(--d) var(--ease),visibility 0s}
.layer{visibility:hidden;transition:transform var(--d) var(--ease),opacity var(--d) var(--ease),visibility 0s linear var(--d)}
.layer.on{visibility:visible;transition:transform var(--d) var(--ease),opacity var(--d) var(--ease),visibility 0s}
.layer:not(.on),.layer.settling{pointer-events:none}

/* drawer */
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);background:var(--surface);border-right:1px solid var(--line-soft);transform:translateX(-100%);display:flex;flex-direction:column;
  padding:max(12px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.drawer.on{transform:none}
.d-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.d-brand img{height:24px;width:24px}
.d-brand b{font-size:19px;font-weight:600;letter-spacing:-.02em}
.d-search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px;margin-bottom:6px}
.d-search .ic{width:17px;height:17px;color:var(--faint)}
.d-search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15.5px}
.d-search input::placeholder{color:var(--faint)}
.d-new{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;font-size:15px;font-weight:500}
.d-new .ic{color:var(--fg-soft)}
.d-new:active{background:var(--raised)}
.chat-list{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0}
.d-label{font-size:12.5px;font-weight:500;color:var(--faint);padding:14px 12px 4px}
.ci{display:flex;align-items:center;border-radius:12px}
.ci.active{background:var(--raised)}
.ci .open{flex:1;min-width:0;text-align:left;padding:10px 12px;font-size:15px;color:var(--fg-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci.active .open{color:var(--fg)}
.ci .more{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--faint);flex:0 0 auto}
.ci .more .ic{width:18px;height:18px}
.ci .more:active{background:var(--raised-2);color:var(--fg)}
.empty-list{color:var(--faint);font-size:14px;padding:12px}
.d-foot{border-top:1px solid var(--line-soft);padding-top:8px;margin-top:6px}
.d-foot button{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;font-size:15px;color:var(--fg-soft)}
.d-foot button:active{background:var(--raised)}

/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);border-radius:26px 26px 0 0;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(100%)}
.sheet.on{transform:none}
.sheet.dragging{transition:none}
@media (min-width:720px){.sheet{left:50%;right:auto;width:560px;margin-left:-280px}}
.grab{padding:10px 0 4px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab i{width:38px;height:4px;border-radius:4px;background:var(--line)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 6px 20px;touch-action:none}
.sheet-head h2{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:2px 10px max(18px,env(safe-area-inset-bottom,0px))}
.msearch{margin:2px 0 6px}
.mgroup{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px}
.mrow{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;text-align:left;min-height:52px}
.mrow .tx{flex:1;min-width:0}
.mrow b{display:block;font-weight:500;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .tx span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow > .ic{color:var(--muted)}
.mrow .check{color:var(--accent)}
.mrow .chev{width:18px;height:18px;color:var(--faint)}
.mrow .tag{font-size:13px;color:var(--accent);white-space:nowrap}
.mrow.sel{background:var(--raised)}
.mrow:active{background:var(--raised)}
.mrow.danger b,.mrow.danger > .ic{color:var(--danger)}
.mempty{color:var(--muted);font-size:14.5px;padding:14px 12px}

/* full screen page */
.page{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);padding-top:env(safe-area-inset-top,0px)}
.page.on{transform:none}
.page-head{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:56px;padding:0 4px;flex:0 0 auto}
.page-head h2{margin:0;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px max(36px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column}

/* dialog */
.dialog{position:fixed;left:50%;top:50%;width:min(360px,calc(100vw - 40px));transform:translate(-50%,-46%) scale(.96);opacity:0;background:#151517;border:1px solid var(--line);border-radius:24px;padding:22px 18px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.dialog.on{transform:translate(-50%,-50%);opacity:1}
.dialog h3{margin:0 2px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.dialog p{margin:0 2px;color:var(--muted);font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.dialog .btns{justify-content:flex-end;margin-top:8px}

/* settings building blocks */
.glabel{font-size:13px;font-weight:500;color:var(--muted);padding:22px 6px 8px}
.glabel:first-child{padding-top:10px}
.group{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;overflow:hidden}
.group > * + *{border-top:1px solid var(--line-soft)}
.row{width:100%;display:flex;align-items:center;gap:14px;min-height:56px;padding:12px 16px;text-align:left}
.row > .ic{color:var(--muted)}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .tx b{font-weight:500;font-size:15.5px}
.row .tx span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{font-size:14px;color:var(--muted);white-space:nowrap}
.row .val.ok{color:var(--accent)}
.row .chev{width:18px;height:18px;color:var(--faint)}
button.row:active{background:var(--raised)}
.row.danger b,.row.danger > .ic{color:var(--danger)}
.gnote{font-size:13px;color:var(--muted);padding:10px 6px 0;line-height:1.55}
.field{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.field > label,.flabel{font-size:13px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.flabel em{font-style:normal;color:var(--fg)}
.field small{color:var(--muted);font-size:13px;line-height:1.5}
.inrow{display:flex;gap:8px;align-items:center}
.inrow .input{flex:1;min-width:0}
.switch{width:48px;height:30px;border-radius:999px;background:var(--raised-2);position:relative;flex:0 0 auto;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#cfcfcc;transition:transform .22s var(--ease),background .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border-radius:11px;font-size:14px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--raised-2);color:var(--fg)}
.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:0;font-size:16px}
.input:focus{border-color:#3d3d44}
.input::placeholder{color:var(--faint)}
textarea.input{resize:vertical;min-height:110px;line-height:1.5}
select.input{appearance:none;background-image:none}
.btn{height:46px;padding:0 18px;border-radius:14px;background:var(--raised);font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn .ic{width:17px;height:17px}
.btn:active{background:var(--raised-2)}
.btn.primary{background:var(--fg);color:#000}
.btn.primary:active{background:#fff}
.btn.ghost{background:none;color:var(--fg-soft)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:13.5px;color:var(--muted);line-height:1.5}
.status:empty{display:none}
.status.bad{color:var(--danger)}
.status.good{color:var(--ok)}
.codechip{font-family:var(--mono);font-size:12.5px;background:var(--raised);padding:2px 7px;border-radius:6px;color:var(--fg-soft);word-break:break-all}
.steps{margin:0;padding-left:1.25em;color:var(--fg-soft);font-size:14.5px;line-height:1.6}
.steps li{margin:.2em 0}
.range{width:100%;accent-color:var(--accent)}
.range-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--faint)}

.toast{position:fixed;left:50%;bottom:calc(122px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--fg);color:#000;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);z-index:500;max-width:calc(100vw - 40px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes flow{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

// Chrome blocks http calls from this https page unless the address is local and the user allows local network access.
function addrSpace(url){
  try {
    const u = new URL(url); const hn = u.hostname.replace(/^\[|\]$/g, "");
    if (u.protocol !== "http:") return null;
    if (hn === "localhost" || hn.endsWith(".localhost") || /^127\./.test(hn) || hn === "::1") return "loopback";
    if (/^10\./.test(hn) || /^192\.168\./.test(hn) || /^172\.(1[6-9]|2\d|3[01])\./.test(hn) || /^169\.254\./.test(hn) || /^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\./.test(hn) || hn.endsWith(".local") || (hn.includes(":") && /^f[cd]|^fe80/i.test(hn))) return "local";
  } catch (e) {}
  return null;
}
async function apiFetch(P, path, opts){
  opts = opts || {};
  const url = P.base.replace(/\/+$/, "") + path;
  const headers = Object.assign({}, opts.headers || {});
  if (P.key) headers.Authorization = "Bearer " + P.key;
  if (P.id === "openrouter") { headers["HTTP-Referer"] = location.origin; headers["X-Title"] = "Vesper"; }
  const init = Object.assign({}, opts, {headers});
  const space = P.local ? addrSpace(url) : null;
  if (space) {
    try { return await fetch(url, Object.assign({}, init, {targetAddressSpace:space})); }
    catch (e) { if (e && e.name === "TypeError" && /enum|targetAddressSpace|address ?space/i.test(String(e.message))) return fetch(url, init); throw e; }
  }
  return fetch(url, init);
}
function friendlyError(status, body, P){
  const msg = (body && body.error && (body.error.message || body.error.code)) || (body && body.message) || "";
  if (status === 401 || status === 403) return P.local ? P.name + " refused the request. Check its API key, or remove the key if the server needs none." : "Your " + P.name + " key was rejected. Paste a fresh key from " + PROVIDERS[P.id].siteName + ".";
  if (status === 402) return "This model needs paid credits. Pick a free model instead.";
  if (status === 429) return "You hit the free limit on " + P.name + ", or it is busy. Wait a minute, or switch to a model from another provider.";
  if (status === 404) return P.local ? P.name + " doesn't have this model. Check the model name in Settings." : "This model isn't available anymore. Pick another one.";
  if (status === 413) return "This chat is too long for the model. Start a new chat.";
  if (status >= 500) return P.name + " is having trouble right now. Try again in a moment.";
  return msg ? "Error from " + P.name + ": " + msg : "Something went wrong. Check your connection and try again.";
}
const netError = P => P.local
  ? "Couldn't reach " + P.name + " at " + P.base + ". Check that the server is running, that it allows this site, and that this phone is on the same WiFi."
  : "Couldn't reach " + P.name + ". Check your internet and try again.";

/* discover models a provider offers right now. New finds start hidden so the picker stays short. */
async function discover(pid){
  const P = provOf(pid); if (!P) return {added:0, err:"unknown provider"};
  if (!P.local && !P.key && pid !== "openrouter") return {added:0, err:"no key"};
  try {
    const r = await apiFetch(pid === "openrouter" ? Object.assign({}, P, {key:""}) : P, "/models");
    if (!r.ok) return {added:0, err:P.name + " answered " + r.status};
    const j = await r.json(); const data = j.data || j.models || [];
    let list;
    if (pid === "openrouter") {
      list = data.filter(m => m.id.endsWith(":free") || (m.pricing && +m.pricing.prompt === 0 && +m.pricing.completion === 0))
        .filter(m => !SKIP.test(m.id) && (!m.architecture || !m.architecture.output_modalities || m.architecture.output_modalities.includes("text")))
        .map(m => ({id:m.id, name:(m.name || m.id).replace(/\s*\(free\)\s*$/i, "").replace(/^[^:]{2,30}:\s*/, ""), note:"Free"}));
      const live = new Set(data.map(m => m.id));
      S.models = S.models.filter(m => m.p !== "openrouter" || live.has(m.id) || DEFAULT_MODELS.some(d => d.id === m.id));
    } else {
      list = data.map(m => String(m.id || m.name || "").replace(/^models\//, "")).filter(id => id && !SKIP.test(id)).map(id => ({id, name:id, note:P.local ? P.name : ""}));
    }
    let added = 0;
    list.forEach(m => {
      if (S.models.some(x => x.p === pid && x.id === m.id)) return;
      const nm = Object.assign({p:pid}, m); S.models.push(nm); added++;
      if (!P.local) S.hidden.push(mk(nm));
    });
    fixModels(); save();
    return {added, total:list.length};
  } catch (e) { return {added:0, err:P.local ? "unreachable" : P.name + " unreachable"}; }
}

/* ---------- layers: drawer, sheets, pages, dialogs ----------
   One stack, mirrored in browser history, so Android back closes the top layer.
   A layer ignores taps while it slides in, and stops taking taps the moment it starts closing.
   While a close is in flight, new opens wait for it to finish. */
const DUR = 300;
const stack = [];
let navBusy = false, queue = [], navTimer = 0;
const appEl = $("#app");
function zFor(i){ return 40 + i * 3; }
function showLayer(L){
  const i = stack.indexOf(L);
  if (L.scrim) { L.scrim.style.zIndex = zFor(i); L.scrim.classList.add("on"); }
  L.el.style.zIndex = zFor(i) + 1;
  L.el.removeAttribute("inert");
  L.el.classList.add("settling");
  void L.el.offsetWidth;
  L.el.classList.add("on");
  clearTimeout(L.t);
  L.t = setTimeout(() => { L.el.classList.remove("settling"); if (L.focus) L.focus(); }, DUR);
  appEl.inert = true;
}
function hideLayer(L){
  clearTimeout(L.t);
  if (L.el.contains(document.activeElement)) document.activeElement.blur();
  L.el.classList.remove("on", "settling", "dragging");
  L.el.style.transform = "";
  L.el.setAttribute("inert", "");
  if (L.scrim) L.scrim.classList.remove("on");
  if (L.onHide) L.onHide();

  appEl.inert = stack.length > 0;

function open(id, factory, swap){

  const L = factory(); L.id = id;
  if (swap && stack.length) { hideLayer(stack.pop()); stack.push(L); }
  else { stack.push(L); history.pushState({vd:stack.length}, ""); }
  showLayer(L);
}
function closeTop(){ if (navBusy) { queue.push(closeTop); return; } if (!stack.length) return; navBusy = true; history.back(); clearTimeout(navTimer); navTimer = setTimeout(unlock, 700); }

addEventListener("popstate", e => {

  while (stack.length > depth) hideLayer(stack.pop());
  const top = stack[stack.length - 1];
  if (top && top.refresh) top.refresh();
  if (!stack.length) refreshMain();
  unlock();
});
addEventListener("keydown", e => { if (e.key === "Escape" && stack.length) closeTop(); });

function iconBtn(name, label, fn){ return h("button", {class:"icon-btn", type:"button", "aria-label":label, onclick:fn, html:ic(name)}); }
function makeSheet(title){

  const grab = h("div", {class:"grab"}, h("i"));

function dragToClose(L, handles){

/* streaming */
async function generate(){
  const c = chat(); if (!c) return;
  const m = modelByKey(c.model); const P = m && provOf(m.p);
  if (!m || !P) { openModels(); return; }
  const len = LENGTHS.find(l => l.id === S.len) || LENGTHS[1];
  const history = c.messages.filter(x => !x.error).map(x => ({role:x.role, content:x.content}));
  const payload = {model:m.id, stream:true, temperature:S.temp, max_tokens:len.tokens, messages:[{role:"system", content:systemPrompt()}].concat(history)};

  busy = true; busyChat = c.id; syncSend();
  const wrap = h("div", {class:"msg ai"}); const ans = h("div", {class:"answer", html:`<span class="thinking">${WAVE}<span class="shimmer">Thinking</span></span>`});
  wrap.append(ans); live = wrap; inner.append(wrap); stickDown(true);
  controller = new AbortController();
  let text = "", reasoning = "", t0 = 0, secs = 0, raf = 0, rEl = null, body = null, aborted = false, fail = null;
  const paint = () => {
    raf = 0;
    if (reasoning && S.thinking) {
      if (!rEl) { ans.innerHTML = ""; rEl = reasonEl("", 0, true); ans.append(rEl); }
      rEl.querySelector(".rtext").textContent = reasoning;
      if (text && !rEl.dataset.done) { rEl.dataset.done = "1"; rEl.querySelector("summary").innerHTML = `<span>Thought for ${secs || 1}s</span>` + ic("chevron-down"); }
    }
    if (text) {
      if (!body) { if (!rEl) ans.innerHTML = ""; body = h("div", {class:"md"}); ans.append(body); }
      body.innerHTML = md(text); decorate(body);
    }
    if (wrap.isConnected) stickDown(false);
  };
  const sched = () => { if (!raf) raf = requestAnimationFrame(paint); };
  try {
    const res = await apiFetch(P, "/chat/completions", {method:"POST", signal:controller.signal, headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
    if (!res.ok) {
      let b = null; try { b = await res.json(); } catch (e) {}
      throw {friendly:friendlyError(res.status, b, P), fix:(res.status === 401 || res.status === 403) ? (P.local ? "local" : "key") : null};
    }
    const ct = res.headers.get("content-type") || "";
    if (!ct.includes("event-stream") && ct.includes("json")) {
      const j = await res.json(); const msg = (j.choices && j.choices[0] && j.choices[0].message) || {};
      text = msg.content || ""; reasoning = msg.reasoning || msg.reasoning_content || ""; paint();
    } else {
      const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
      while (true) {
        const {value, done} = await reader.read(); if (done) break;
        buf += dec.decode(value, {stream:true});
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim(); if (data === "[DONE]") continue;
          let j; try { j = JSON.parse(data); } catch (e) { continue; }
          if (j.error) throw {friendly:friendlyError(+j.error.code || 0, j, P)};
          const d = (j.choices && j.choices[0] && j.choices[0].delta) || {};
          const r = typeof d.reasoning === "string" ? d.reasoning : (typeof d.reasoning_content === "string" ? d.reasoning_content : "");
          if (r) { if (!t0) t0 = performance.now(); reasoning += r; sched(); }
          if (typeof d.content === "string" && d.content) { if (t0 && !secs) secs = Math.max(1, Math.round((performance.now() - t0) / 1000)); text += d.content; sched(); }
        }
      }
    }
    if (!text.trim()) fail = {friendly:"The model sent an empty reply. Try again, or pick another model."};
  } catch (err) {
    if (err && err.name === "AbortError") aborted = true;
    else fail = err && err.friendly ? err : {friendly:netError(P), fix:P.local ? "local" : null};
  }
  if (raf) cancelAnimationFrame(raf);
  if (text.trim()) {
    const out = {role:"assistant", content:text, model:mk(m)};
    if (reasoning) { out.reasoning = reasoning.slice(0, 20000); out.secs = secs || Math.max(1, Math.round((performance.now() - (t0 || performance.now())) / 1000)); }
    c.messages.push(out);
  } else if (aborted) c.messages.push({role:"assistant", error:true, content:"You stopped this reply.", model:mk(m)});
  else c.messages.push({role:"assistant", error:true, content:fail.friendly, fix:fail.fix || null, pid:P.id, model:mk(m)});
  busy = false; busyChat = null; controller = null; live = null;
  c.updated = Date.now(); save(); syncSend();
  if (chat() === c) renderThread(true);
}

function dayGroup(t){
  const d = new Date(t), now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if (t >= start) return "Today";
  if (t >= start - 864e5) return "Yesterday";
  if (t >= start - 7 * 864e5) return "Previous 7 days";
  if (t >= start - 30 * 864e5) return "Previous 30 days";
  return d.toLocaleDateString(undefined, {month:"long", year:"numeric"});
}

          if (r.ok) { const j = await r.json(); found = {base:cand, ids:(j.data || j.models || []).map(m => String(m.id || m.name || m.model || "")).filter(Boolean)}; break; }
          lastErr = r.status === 401 || r.status === 403 ? "The server needs a different API key." : "The server answered with error " + r.status + ".";
        } catch (e) { lastErr = "Couldn't reach the server. Check the address, that it's running, and that it allows this site."; }
      }
      if (!found && !force) { set(lastErr, "bad"); note.offerSave = true; L.refresh(); return; }
      const conn = {id:draft.id, kind:draft.kind, name:(draft.name || "").trim() || PRESETS[draft.kind].name, base:found ? found.base : b, key:draft.key.trim()};
      const i = S.conns.findIndex(c => c.id === conn.id); if (i >= 0) S.conns[i] = conn; else S.conns.push(conn);
      let added = 0;
      if (found) found.ids.filter(x => !SKIP.test(x)).forEach(mid => { if (!S.models.some(m => m.p === conn.id && m.id === mid)) { S.models.push({p:conn.id, id:mid, name:mid, note:conn.name}); added++; } });
      S.models.filter(m => m.p === conn.id).forEach(m => { m.note = conn.name; });
      const cur = modelByKey(S.model); const firstLocal = S.models.find(m => m.p === conn.id);
      if ((!cur || !ready(cur.p)) && firstLocal) S.model = mk(firstLocal);
      Object.assign(draft, conn); fixModels(); save(); renderChip(); renderHeader(); if (!chat()) renderThread();
      note.offerSave = false;
      note.text = found ? (found.ids.length ? "Connected. Found " + found.ids.length + " model" + (found.ids.length === 1 ? "" : "s") + (added ? "" : ", nothing new") + "." : "Connected, but the server listed no models. Add one by name below.") : "Saved without testing. Add a model by name below.";
      note.cls = found ? "good" : ""; L.el.querySelector(".page-head h2").textContent = conn.name; L.refresh();
    };
    if (!saved) w.append(glabel("App"), seg(kinds, draft.kind, pickKind));
    w.append(glabel("Connection"), group(
      h("div", {class:"field"}, h("label", {text:"Name"}), name),
      h("div", {class:"field"}, h("label", {text:"Server address"}), base, h("small", {text:"On this phone, use your computer's WiFi address, like http://192.168.1.20:11434. Find it in your computer's network settings."})),
      h("div", {class:"field"}, h("label", {text:"API key, optional"}), key),
      h("div", {class:"field"}, h("div", {class:"btns"},
        h("button", {class:"btn primary", type:"button", text:saved ? "Save and test" : "Connect", onclick:() => connect(false)}),
        note.offerSave ? h("button", {class:"btn", type:"button", text:"Save anyway", onclick:() => connect(true)}) : null), st)));
    if (saved) {
      const ms = S.models.filter(m => m.p === saved.id);
      const addIn = h("input", {class:"input", placeholder:"Model name, like llama3.2", spellcheck:"false", autocapitalize:"off", "aria-label":"Model name"});
      const add = () => { const v = addIn.value.trim(); if (!v) return; if (!S.models.some(m => m.p === saved.id && m.id === v)) S.models.push({p:saved.id, id:v, name:v, note:saved.name, added:true}); save(); L.refresh(); toast("Model added"); };
      w.append(glabel("Models on this server"), group(
        ...ms.map(m => h("div", {class:"row"}, h("div", {class:"tx"}, h("b", {text:m.name})),
          h("button", {class:"btn", type:"button", style:"height:36px;padding:0 14px;font-size:14px", text:mk(m) === curKey() ? "In use" : "Use", disabled:mk(m) === curKey() ? true : null, onclick:() => { S.model = mk(m); const c = chat(); if (c) c.model = mk(m); save(); renderChip(); L.refresh(); toast("Using " + m.name); }}))),
        h("div", {class:"field"}, h("label", {text:"Add a model by name"}), h("div", {class:"inrow"}, addIn, h("button", {class:"btn", type:"button", text:"Add", onclick:add})))));
    }
    w.append(glabel("Set up your computer"), group(h("div", {class:"field"}, h("ol", {class:"steps", html:localTips(draft.kind)}))));
    if (saved) w.append(h("div", {style:"padding-top:16px"}, h("button", {class:"btn danger block", type:"button", text:"Remove this connection", onclick:() => dialog({title:"Remove " + saved.name + "?", text:"Its models leave the picker. Your chats stay.", ok:"Remove", danger:true, onOk:() => {
      S.conns = S.conns.filter(c => c.id !== saved.id); S.models = S.models.filter(m => m.p !== saved.id); fixModels(); save(); renderChip(); closeTop(); toast("Connection removed");
    }})})));
  }), swap);
}

/* manage models */
function manageModels(swap){
  const note = {text:"", cls:""};
  open("manage", () => makePage("Manage models", (w, L) => {
    const st = h("div", {class:"status " + note.cls, text:note.text});
    w.append(group(h("div", {class:"field"},
      h("button", {class:"btn", type:"button", html:ic("refresh-cw") + "Find new models", onclick:async () => {
        st.className = "status"; st.textContent = "Looking…";
        let added = 0; const errs = [];
        for (const pid of provIds().filter(p => ready(p) || p === "openrouter")) { const r = await discover(pid); added += r.added || 0; if (r.err) errs.push(provOf(pid).name + " " + r.err); }
        note.text = (added ? added + (added === 1 ? " new model found. It starts hidden, turn it on below." : " new models found. They start hidden, turn on the ones you want.") : "No new models found.") + (errs.length ? " Problems: " + errs.join(", ") + "." : "");
        note.cls = errs.length ? "bad" : "good"; L.refresh();
      }}), st)));
    w.append(gnote("Only models you turn on show in the picker. Hidden ones stay here."));
    provIds().filter(pid => ready(pid)).forEach(pid => {
      const ms = S.models.filter(m => m.p === pid); if (!ms.length) return;
      w.append(glabel(provOf(pid).name), group(...ms.map(m => {
        const r = switchRow({title:m.name, sub:m.name !== m.id ? m.id : (m.note || ""), get:() => !isHidden(m), set:v => {
          const k = mk(m); S.hidden = S.hidden.filter(x => x !== k); if (!v) S.hidden.push(k); save();
        }});
        if (m.added) r.insertBefore(actBtn("trash-2", "Remove " + m.name, () => { S.models = S.models.filter(x => x !== m); fixModels(); save(); renderChip(); L.refresh(); }), r.lastChild);
        return r;
      })));
    });
    const readyIds = provIds().filter(p => ready(p));
    if (readyIds.length) {
      const sel = h("select", {class:"input", "aria-label":"Provider"}, ...readyIds.map(p => h("option", {value:p, text:provOf(p).name})));
      const mid = h("input", {class:"input", placeholder:"Exact model name", spellcheck:"false", autocapitalize:"off", "aria-label":"Model name"});
      w.append(glabel("Add a model by name"), group(h("div", {class:"field"}, sel, mid,
        h("small", {text:"Use the name exactly as the provider lists it. On OpenRouter, names ending in :free cost nothing."}),
        h("button", {class:"btn", type:"button", text:"Add model", onclick:() => {
          const v = mid.value.trim(); const p = sel.value; if (!v) { toast("Type the model name first"); return; }
          if (!S.models.some(m => m.p === p && m.id === v)) S.models.push({p, id:v, name:v.split("/").pop().replace(/:free$/, ""), note:"Added by you", added:true});
          save(); L.refresh(); toast("Model added");
        }}))));
    }
  }), swap);
}

function openPersonal(){
  open("personal", () => makePage("Personalize", w => {
    const about = h("textarea", {class:"input", rows:"4", placeholder:"Your work, your style, anything useful. For example: I make short video ads.", "aria-label":"About you"});
    const respond = h("textarea", {class:"input", rows:"4", placeholder:"For example: be brief, skip the intro, use bullet points for steps.", "aria-label":"How to reply"});
    about.value = S.about; respond.value = S.respond;
    about.oninput = () => { S.about = about.value; save(); };
    respond.oninput = () => { S.respond = respond.value; save(); };
    w.append(glabel("What should Vesper know about you?"), group(h("div", {class:"field"}, about)),
      glabel("How should Vesper reply?"), group(h("div", {class:"field"}, respond)),
      gnote("Sent with every chat. Leave both empty for a normal chat."));
  }));
}
function openStyle(){
  open("style", () => makePage("Response style", w => {
    const word = h("em", {text:creativityWord(S.temp)});
    const range = h("input", {class:"range", type:"range", min:"0", max:"1.5", step:"0.05", "aria-label":"Creativity"}); range.value = S.temp;
    range.oninput = () => { S.temp = +range.value; word.textContent = creativityWord(S.temp); save(); };
    w.append(glabel("Creativity"), group(h("div", {class:"field"}, h("div", {class:"flabel"}, h("span", {text:"How free the wording is"}), word), range, h("div", {class:"range-row"}, h("span", {text:"Focused"}), h("span", {text:"Balanced"}), h("span", {text:"Wild"})))));
    w.append(glabel("Reply length"), seg(LENGTHS.map(l => ({id:l.id, label:l.label})), S.len, v => { S.len = v; save(); }),
      gnote("This is the most a reply can use. Longer replies spend more of your free limit."));
  }));
}

/* data */
function exportChats(){
  const data = {app:"Vesper", version:2, exported:new Date().toISOString(), chats:S.chats.filter(c => !c.temp)};
  const a = h("a", {href:URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type:"application/json"})), download:"vesper-chats-" + new Date().toISOString().slice(0, 10) + ".json"});
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast("Backup saved");
}
$("#importFile").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); const list = Array.isArray(j) ? j : j.chats;
    if (!Array.isArray(list)) throw 0;
    let n = 0;
    list.forEach(c => {
      if (!c || !c.id || !Array.isArray(c.messages) || S.chats.some(x => x.id === c.id)) return;
      const nc = {id:String(c.id), title:String(c.title || "Imported chat"), model:c.model, updated:+c.updated || Date.now(),
        messages:c.messages.filter(m => m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string").map(m => Object.assign({}, m))};
      S.chats.push(nc); n++;
    });
    fixModels(); save(); renderDrawer(); toast(n ? "Imported " + n + " chat" + (n === 1 ? "" : "s") : "Nothing new to import");
  } catch (err) { toast("That file isn't a Vesper backup"); }
});

/* toast */
let tt = 0;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 2000); }

/* boot */
function syncEnterHint(){ input.setAttribute("enterkeyhint", enterSends() ? "send" : "enter"); }
syncEnterHint();
history.replaceState({vd:0}, "");
refreshMain();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
